[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastci-reimpl"
version = "0.1.0"
description = "Paper-aligned, portable FastCI reference reimplementation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
keywords = ["ci", "regression-testing", "test-selection", "gpu", "fastci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
trace = ["py-spy>=0.3"]
megatron = ["PyYAML>=6", "click>=8"]

[project.scripts]
fastci = "fastci.cli:main"
fastci-megatron = "fastci.megatron.__main__:main"

[tool.setuptools.packages.find]
include = ["fastci*"]

[tool.setuptools]
include-package-data = false
